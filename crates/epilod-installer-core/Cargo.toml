[package]
name = "epilod-installer-core"
version = "0.1.8"
edition = "2021"
license = "GPL-3.0-only"

[dependencies]
epilod-core = { path = "../epilod-core" }
lzma-rust2 = { version = "0.25.0", default-features = false, features = ["std", "encoder", "optimization"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[[bin]]
name = "epilod-pack"
path = "src/bin/epilod_pack.rs"
