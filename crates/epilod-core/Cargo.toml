[package]
name = "epilod-core"
version = "0.1.7"
edition = "2021"
license = "GPL-3.0-only"

[features]
# Enforce at compile time that EPILOD_UPDATE_PUBKEY is embedded for release update verification.
require-signed-updates = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
getrandom = "0.2"
thiserror = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "2", default-features = false, features = ["fast", "zeroize"] }
chacha20poly1305 = "0.10"
sonora = "0.3.0"
sonora-agc2 = "0.3.0"
sonora-simd = "0.3.0"
dfn3_rs = "0.1.2"
