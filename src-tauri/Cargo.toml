[package]
name = "epilod-party"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[lib]
name = "epilod_party_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
epilod-core = { path = "../crates/epilod-core" }

[target.'cfg(windows)'.dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "process", "macros"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader"] }
native-tls = "0.2"
tokio-native-tls = "0.3"

[target.'cfg(windows)'.build-dependencies]
tauri-build = { version = "2", features = [] }
