[package]
name = "epilod-party"
version = "0.1.6"
edition = "2021"
license = "GPL-3.0-only"

[lib]
name = "epilod_party_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Embeds the built frontend (../dist) into the binary. Without it Tauri compiles in "dev" mode and the
# window loads devUrl (http://localhost:1420) instead of the bundled UI. `tauri build` enables this
# automatically; plain `cargo build --release` (scripts/build-installer.ps1) must pass it explicitly.
custom-protocol = ["tauri/custom-protocol"]
# Feature gate for v1.1 acoustic echo cancellation (checked in CI alongside default build).
aec = []
# Enforce at compile time that EPILOD_UPDATE_PUBKEY is embedded in the release binary.
require-signed-updates = ["epilod-core/require-signed-updates"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
epilod-core = { path = "../crates/epilod-core" }

[target.'cfg(windows)'.dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
epilod-installer-core = { path = "../crates/epilod-installer-core" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "process", "macros"] }
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Power",
  "Win32_Storage_FileSystem",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_JobObjects",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
] }
native-tls = "0.2"
tokio-native-tls = "0.3"
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
audiopus = "0.3.0-rc.0"
cpal = "0.15"
ringbuf = "0.5.2"
rubato = "0.16"
wasapi = "0.27"

[target.'cfg(windows)'.build-dependencies]
tauri-build = { version = "2", features = [] }
